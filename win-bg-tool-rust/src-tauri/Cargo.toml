[package]
name = "peel"
version = "2.0.0"
description = "Peel local image background remover"
authors = ["Peel"]
edition = "2024"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
arboard = "3.6"
base64 = "0.22"
image = { version = "0.25.10", default-features = true }
once_cell = "1.21"
ort = { version = "2.0.0-rc.13", default-features = true, features = ["directml"] }
rfd = { version = "0.16", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["tray-icon"] }
ureq = { version = "3.4", default-features = true }
uuid = { version = "1.17", features = ["v4", "fast-rng"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
